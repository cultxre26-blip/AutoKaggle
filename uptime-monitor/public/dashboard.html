<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — PingWatch</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"></head><body><main>
<header class="nav"><span class="brand">PingWatch</span><span><span class="muted" id="who"></span> <button class="secondary" id="logout">Sign out</button></span></header>
<div class="card" id="verifyBox" hidden><span>Confirm your email to start adding sites. </span><button class="secondary" id="resend">Resend confirmation email</button> <span class="muted" id="resendMsg"></span></div>
<div class="card" id="planBox"></div>
<div class="card"><h3>Add a site</h3><form id="addForm"><label>Name<input name="name" required maxlength="80"></label>
<label>URL<input name="url" type="url" placeholder="https://example.com" required></label>
<label>Expected text on the page (optional — alerts you if the page loads but this text is missing)<input name="keyword" maxlength="100"></label>
<p class="err" id="addErr"></p><button type="submit">Add site</button></form></div>
<div class="card"><h3>Alert webhook</h3><p class="muted">Also send alerts to Slack, Discord or any URL that accepts JSON.</p><form id="hookForm"><input name="alertWebhookUrl" type="url" placeholder="https://hooks.slack.com/services/..."><p class="err" id="hookErr"></p><button type="submit" class="secondary">Save webhook</button></form></div>
<div id="sites"></div>
<p><button class="danger" id="deleteAcct">Delete my account</button></p>
</main><script src="/app.js"></script><script src="/dashboard.js"></script></body></html>
