<title>Dashboard — PingWatch</title><link rel="stylesheet" href="/style.css"></head><body><main>
<header class="nav"><span class="brand">PingWatch</span><span><span class="muted" id="who"></span> <button class="secondary" id="logout">Sign out</button></span></header>

</main><script src="/app.js"></script><script src="/dashboard.js"></script></body></html>
